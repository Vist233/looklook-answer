<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>看题</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">看</span><div><h1>看题</h1><p>点击或换网址 → 等待 1.6 秒 → 看图分析</p></div></header>
  <section class="switch-row"><div><strong>自动分析</strong><small id="scope">仅当前标签页</small></div><label class="switch"><input id="enabled" type="checkbox" aria-label="开启自动分析"><span></span></label></section>
  <form id="config">
    <label for="url">API URL</label><input id="url" type="url" required placeholder="https://api.xiaomimimo.com/v1">
    <label for="model">Model Name</label><input id="model" required placeholder="mimo-v2.6-pro">
    <label for="key">API Key</label><div class="key-row"><input id="key" type="password" required autocomplete="off" placeholder="输入 API 密钥"><button id="reveal" type="button" aria-label="显示密钥">显示</button></div>
    <button class="primary" type="submit">保存配置</button>
  </form>
  <p class="notice">开启后，截图会发送到上述 API。默认开启思考；MiMo 使用官方思考开关，不发送未公开的 effort 参数。答案历史保存在本机。</p>
  <div class="actions"><button id="refresh" type="button">立即重新分析</button><button id="history" type="button">历史</button><button id="clear" type="button">清除密钥</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js" type="module"></script>
</body></html>
